<div class="grid">
  <div class="col-12">
    <div class="card px-6 py-6">
      <p-toast></p-toast>

      <div class="flex align-items-center mb-3">
        <button pButton type="button"
                [label]="showInactive ? 'Masquer utilisateurs archivés' : 'Afficher utilisateurs archivés'"
                (click)="toggleShowInactive()">
        </button>
      </div>
      <p-table #dt [value]="filteredUsers" [columns]="cols" responsiveLayout="scroll" [rows]="10"
               [globalFilterFields]="['firstName', 'lastName', 'email','phoneNumber']"
               [paginator]="true"
               [rowsPerPageOptions]="[10,20,30]" [showCurrentPageReport]="true"
               currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
               [(selection)]="selectedUsers"
               selectionMode="multiple" [rowHover]="true" dataKey="id">

        <ng-template pTemplate="caption">
          <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
            <h5 class="m-0">Manage Users</h5>
            <span class="block mt-2 md:mt-0 p-input-icon-left">
              <i class="pi pi-search"></i>
              <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..."
                     class="w-full sm:w-auto"/>
            </span>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="firstName">FirstName<p-sortIcon field="firstName"></p-sortIcon></th>
            <th pSortableColumn="lastName">LastName<p-sortIcon field="lastName"></p-sortIcon></th>
            <th pSortableColumn="phoneNumber">Phone Number<p-sortIcon field="phoneNumber"></p-sortIcon></th>
            <th pSortableColumn="email">Email<p-sortIcon field="email"></p-sortIcon></th>
            <th pSortableColumn="type">Type<p-sortIcon field="type"></p-sortIcon></th>
            <th pSortableColumn="verified">Verified<p-sortIcon field="verified"></p-sortIcon></th>
            <th>Actions</th>
          </tr>
        </ng-template>

        <ng-template #tableBody pTemplate="body" let-user>
          <tr [ngClass]="{'bg-gray-100': user.archived}">
            <td>{{ user.firstName }}</td>
            <td>{{ user.lastName }}</td>
            <td>{{ user.phoneNumber }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.type }}</td>
            <td>{{ user.verified ? 'Oui' : 'Non' }}</td>
            <td>
              <div class="flex justify-content-center">
                <p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
                <button pButton pRipple
                        (click)="updateSelectedUser(user);updateMenuItems(user);menu.toggle($event)"
                        icon="pi pi-ellipsis-h" class="p-button-rounded p-button-success"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
