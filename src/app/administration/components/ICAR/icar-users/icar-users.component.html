  <div class="col-12">
    <div class="card px-6 py-6">

      <p-table #dt [value]="users" [columns]="cols" responsiveLayout="scroll" [rows]="10"
               [globalFilterFields]="['firstName', 'lastName', 'email','phoneNumber']"
               [paginator]="true"
               [rowsPerPageOptions]="[10,20,30]" [showCurrentPageReport]="true"
               currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
               [(selection)]="selectedUsers"
               selectionMode="multiple" [rowHover]="true" dataKey="id">
        <ng-template pTemplate="caption">
          <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
            <h5 class="m-0">Manage Users</h5>
            <span class="block mt-2 md:mt-0 p-input-icon-left">
                                          <span class="block mt-2 mb-3 ml-2 md:mt-0 p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..."
                                   class="w-full sm:w-auto"/>
                        </span>
                        </span>
          </div>
        </ng-template>
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="firstName">FirstName
              <p-sortIcon field="firstName"></p-sortIcon>
            </th>
            <th pSortableColumn="lastName">LastName
              <p-sortIcon field="lastName"></p-sortIcon>
            </th>
            <th pSortableColumn="phoneNumber">Phone Number
              <p-sortIcon field="phoneNumber"></p-sortIcon>
            </th>
            <th pSortableColumn="email">Email
              <p-sortIcon field="email"></p-sortIcon>
            </th>
            <th pSortableColumn="type">Type
              <p-sortIcon field="type"></p-sortIcon>
            </th>
            <th pSortableColumn="type">Verified
              <p-sortIcon field="type"></p-sortIcon>
            </th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template #tableBody pTemplate="body" let-user>
          <tr>
            <td style="width:10%; min-width:10rem;">
              <span class="p-column-title">First name</span>
              {{ user.firstName }}
            </td>

            <td style="width:10%; min-width:8rem;">
              <span class="p-column-title">Last name</span>
              {{ user.lastName }}
            </td>
            <td style="width:10%; min-width:10rem;">
              <span class="p-column-title">Phone number</span>
              {{ user.phoneNumber }}
            </td>
            <td style="width:10%; min-width:10rem;">
              <span class="p-column-title">Email</span>
              {{ user.email }}
            </td>
            <td style="width:10%; min-width:10rem;">
              <span class="p-column-title">Type</span>
              {{ user.type }}
            </td>
            <td style="width:10%; min-width:10rem;">
              <span class="p-column-title">Status</span>
              {{ user.verified ? 'Oui' : 'Non' }}
            </td>
            <!--
                        <td style="width:10%; min-width:5rem;">
                          <span class="p-column-title">Enabled</span>
                          <p-inputSwitch [(ngModel)]="user.enabled"
                                         (onChange)="onEnableUserChange($event,user)"></p-inputSwitch>
                        </td>-->
            <td style="width:10%; min-width:8rem;">
              <div class="flex justify-content-center">
                <p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
                <button pButton pRipple
                        (click)="updateSelectedUser(user);updateMenuItems(user);menu.toggle($event)"
                        icon="pi pi-ellipsis-h" class="p-button-rounded p-button-success"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
