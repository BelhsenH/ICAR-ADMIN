<div *ngIf="loading">Chargement des campagnes...</div>

<table *ngIf="!loading">
  <thead>
  <tr>
    <th>Titre</th>
    <th>Type</th>
    <th>Status</th>
    <th>Destinataires</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let campaign of campaigns">
    <td>{{ campaign.title }}</td>
    <td>{{ campaign.type }}</td>
    <td>{{ campaign.status }}</td>
    <td>{{ campaign.recipients.join(', ') }}</td>
    <td>
      <button (click)="sendCampaign(campaign)" [disabled]="campaign.status==='sent'">Envoyer</button>
      <button (click)="deleteCampaign(campaign)">Supprimer</button>
    </td>
  </tr>
  </tbody>
</table>
