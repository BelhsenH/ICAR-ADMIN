<form [formGroup]="form" (ngSubmit)="submit()">
  <label>Type:</label>
  <select formControlName="type">
    <option value="email">Email</option>
    <option value="sms">SMS</option>
  </select>

  <label>Titre:</label>
  <input formControlName="title" />

  <label>Contenu:</label>
  <textarea formControlName="content"></textarea>

  <div formArrayName="recipients">
    <label>Destinataires:</label>
    <div *ngFor="let r of recipients.controls; let i=index">
      <input [formControlName]="i" />
      <button type="button" (click)="removeRecipient(i)" *ngIf="recipients.length>1">Supprimer</button>
    </div>
    <button type="button" (click)="addRecipient()">Ajouter un destinataire</button>
  </div>

  <button type="submit">Créer la campagne</button>
</form>
